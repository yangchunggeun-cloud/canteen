<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>구내식당 식수 관리</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f4f4f2;color:#1a1a1a;font-size:14px}
.app{max-width:640px;margin:0 auto;padding:12px 12px 40px}
.hdr{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.hdr-title{font-size:18px;font-weight:700;line-height:1.1}
.hdr-sub{font-size:10px;color:#bbb;letter-spacing:1px;font-weight:500}
.pill{font-size:10px;padding:2px 8px;border-radius:20px;display:inline-flex;align-items:center;gap:4px;background:#f0f0f0;color:#555}
.pill-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.spacer{flex:1}
.btn{font-size:12px;padding:5px 12px;border-radius:7px;cursor:pointer;white-space:nowrap;font-family:inherit;border:0.5px solid #ddd;background:#fff;color:#444}
.btn-teal{border-color:#9FE1CB;background:#E1F5EE;color:#0F6E56}
.btn-blue{border-color:#85B7EB;background:#E6F1FB;color:#0C447C}
.btn-green{border-color:#97C459;background:#EAF3DE;color:#27500A}
.btn-red{border-color:#F09595;background:#FCEBEB;color:#A32D2D}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.card-blue{background:#0C447C;border-radius:12px;padding:14px 16px}
.card-white{background:#fff;border:0.5px solid #ddd;border-radius:12px;padding:14px 16px}
.card-num{font-size:28px;font-weight:700;line-height:1}
.card-lbl{font-size:10px;margin-bottom:4px}
.card-sub{font-size:10px;margin-top:4px}
.all-btn{background:#1a1a1a;border-radius:12px;padding:13px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.sec-lbl{font-size:11px;font-weight:500;color:#bbb;margin-bottom:8px;letter-spacing:.5px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.team-card{background:#fff;border:0.5px solid #ebebeb;border-radius:14px;padding:14px 8px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;position:relative}
.team-icon{width:54px;height:54px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#fff;letter-spacing:-.5px;flex-shrink:0}
.team-name{font-size:12px;font-weight:600;line-height:1.3;text-align:center}
.team-count{font-size:11px;color:#aaa}
.team-bar-wrap{width:70%;height:3px;border-radius:2px;background:#f0f0f0;overflow:hidden}
.team-bar{height:100%;border-radius:2px;opacity:.6}
.back-btn{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#888;cursor:pointer;margin-bottom:10px;background:none;border:none;font-family:inherit}
.page-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.team-icon-sm{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0}
.tbl-wrap{overflow-x:auto;border:0.5px solid #ddd;border-radius:10px;background:#fff}
table{border-collapse:collapse;font-size:11px;min-width:100%}
th{padding:5px 6px;text-align:center;font-weight:500;color:#888;background:#fafaf8;border-bottom:0.5px solid #eee;border-right:0.5px solid #eee;white-space:nowrap}
th:last-child,td:last-child{border-right:none}
td{padding:4px 5px;text-align:center;border-bottom:0.5px solid #eee;border-right:0.5px solid #eee;color:#1a1a1a;font-size:12px}
tr:last-child td{border-bottom:none}
td.tl{text-align:left;padding-left:10px;color:#555;font-size:11px;white-space:nowrap}
td.ts{font-weight:500;background:#fafaf8}
td.tb{background:#E1F5EE;font-weight:500;color:#085041}
td.tt{background:#1a1a1a;font-weight:700;color:#fff;font-size:12px;border-bottom:2px solid #444;border-right:0.5px solid #333}
td.tt-blue{background:#185FA5;font-weight:700;color:#fff;font-size:12px;border-bottom:2px solid #444}
input[type=number]{width:44px;padding:3px 2px;border:0.5px solid #d0d0d0;border-radius:4px;font-size:12px;text-align:center;font-family:inherit;outline:none;color:#1a1a1a;background:#fff}
input.ext{border-color:#9FE1CB}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum-card{border-radius:9px;padding:10px 12px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:22px 24px;max-width:280px;width:90%}
.add-form{background:#fff;border:0.5px solid #ddd;border-radius:12px;padding:18px 16px}
.add-row{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px}
.add-field{display:flex;flex-direction:column;gap:5px}
.add-field span{font-size:11px;color:#888}
.add-field input{padding:8px 10px;border:0.5px solid #ddd;border-radius:7px;font-size:13px;font-family:inherit;outline:none;color:#1a1a1a}
.pal-row{display:flex;gap:6px;align-items:center}
.pal-dot{width:22px;height:22px;border-radius:50%;cursor:pointer;flex-shrink:0;border:2.5px solid transparent}
.pal-dot.sel{border-color:#1a1a1a}
.preview{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f9f9f9;border-radius:8px;margin-bottom:14px}
.toast{display:none;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#f5f5f5;padding:8px 20px;border-radius:8px;font-size:12px;z-index:999;pointer-events:none;white-space:nowrap}
.toast.show{display:block}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:12px}
@keyframes sp{to{transform:rotate(360deg)}}
.spinner{width:28px;height:28px;border:2.5px solid #e0e0e0;border-top-color:#378ADD;border-radius:50%;animation:sp .7s linear infinite}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading"><div class="spinner"></div><p style="font-size:13px;color:#999">연결 중...</p></div>
</div>
<div class="modal-bg" id="delModal">
  <div class="modal">
    <p style="font-size:13px;line-height:1.7;margin-bottom:16px" id="delMsg"></p>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn" onclick="closeDelModal()">취소</button>
      <button class="btn btn-red" onclick="confirmDelete()">삭제</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const GAS="https://script.google.com/macros/s/AKfycbzSgQJmYdxHRAKlN9iHV62tNAHWA1PxcDqL-7jb79Z2SxoQnPMU643Or65GvU-xKy2d/exec";
let cbIdx=0;
function jsonp(url){return new Promise((resolve,reject)=>{const cb="__gcb"+(cbIdx++);const s=document.createElement("script");const timer=setTimeout(()=>{cleanup();reject(new Error("timeout"));},10000);function cleanup(){clearTimeout(timer);delete window[cb];if(s.parentNode)s.parentNode.removeChild(s);}window[cb]=function(data){cleanup();resolve(data);};s.onerror=()=>{cleanup();reject(new Error("error"));};s.src=url+(url.includes("?")?"&":"?")+"callback="+cb+"&t="+Date.now();document.head.appendChild(s);});}
async function gasLoad(){const data=await jsonp(GAS);return(data&&typeof data==="object"&&!data.status)?data:null;}
async function gasSave(data){const json=JSON.stringify({...data,ts:Date.now()});const encoded=encodeURIComponent(json);const result=await jsonp(GAS+"?data="+encoded);return result&&result.status==="ok";}
const PAL=[{f:"#378ADD",bg:"#E6F1FB",tc:"#0C447C"},{f:"#7F77DD",bg:"#EEEDFE",tc:"#3C3489"},{f:"#1D9E75",bg:"#E1F5EE",tc:"#085041"},{f:"#EF9F27",bg:"#FAEEDA",tc:"#633806"},{f:"#D85A30",bg:"#FAECE7",tc:"#712B13"},{f:"#D4537E",bg:"#FBEAF0",tc:"#72243E"},{f:"#639922",bg:"#EAF3DE",tc:"#27500A"},{f:"#888780",bg:"#F1EFE8",tc:"#444441"}];
const T0=[{id:"sales",n:"영업팀",d:8,...PAL[0]},{id:"dev",n:"개발팀",d:12,...PAL[1]},{id:"hr",n:"인사팀",d:5,...PAL[2]},{id:"finance",n:"재무팀",d:7,...PAL[3]},{id:"mktg",n:"마케팅팀",d:6,...PAL[4]},{id:"ops",n:"운영팀",d:9,...PAL[5]},{id:"it",n:"IT팀",d:10,...PAL[6]},{id:"mgmt",n:"경영지원팀",d:4,...PAL[7]}];
const WD=["일","월","화","수","목","금","토"];
function workDates(){const r=[],b=new Date();for(let i=0;r.length<10;i++){const d=new Date(b);d.setDate(b.getDate()+i);if(d.getDay()&&d.getDay()<6)r.push(d);}return r;}
const DATES=workDates();const DK=DATES.map(d=>d.toISOString().slice(0,10));
let DATA=null,PAGE="main",TID=null,POLL=null,SAVEQ=null,LATEST=null,PALSEL=0,DELID_P=null;
function mkData(){const o={teams:{},order:T0.map(t=>t.id),ts:Date.now()};T0.forEach(t=>{o.teams[t.id]={n:t.n,d:t.d,f:t.f,bg:t.bg,tc:t.tc,days:{}};DK.forEach(k=>{o.teams[t.id].days[k]={c:t.d,e:0};});});return o;}
function fix(o){if(!o||!o.teams)return mkData();if(!o.order)o.order=Object.keys(o.teams);Object.keys(o.teams).forEach(id=>{const t=o.teams[id];if(!t.days)t.days={};DK.forEach(k=>{if(!t.days[k])t.days[k]={c:t.d||0,e:0};});});return o;}
const cp=o=>JSON.parse(JSON.stringify(o));
const ab=n=>{const s=(n||"").replace(/팀$/,"").replace(/\s/g,"");return s.slice(0,2)||"?";};
const tSum=(D,id)=>{const t=D.teams[id];if(!t)return 0;return DK.reduce((s,k)=>s+(t.days[k]?t.days[k].c+t.days[k].e:0),0);};
const dSum=(D,dk)=>(D.order||[]).reduce((s,id)=>{const t=D.teams[id];return s+(t&&t.days&&t.days[dk]?t.days[dk].c+t.days[dk].e:0);},0);
function showToast(m,ms=2400){const el=document.getElementById("toast");el.textContent=m;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),ms);}
function setPill(t,c){const p=document.getElementById("pill");if(!p)return;p.querySelector(".pill-dot").style.background=c;p.querySelector(".pill-txt").textContent=t;}
function pillHTML(){return`<span class="pill" id="pill"><span class="pill-dot" style="background:#1D9E75"></span><span class="pill-txt">연동됨</span></span>`;}
function qsave(nd){LATEST=nd;if(SAVEQ)clearTimeout(SAVEQ);setPill("저장중...","#EF9F27");SAVEQ=setTimeout(async()=>{const toSave=LATEST;let ok=false;try{ok=await gasSave(toSave);}catch(e){ok=false;}if(오케이){DATA.ts=toSave.ts;setPill("저장됨 ✓","#1D9E75");setTimeout(()=>setPill("연동됨","#1D9E75"),1500);}else{setTimeout(async()=>{let ok2=false;try{ok2=await gasSave(LATEST);}catch(_){}setPill(ok2?"연동됨":"저장실패 ⚠",ok2?"#1D9E75":"#E24B4A");if(!ok2)showToast("저장 실패");else DATA.ts=LATEST.ts;},2000);}},800);}
function upd(fn){const nd=cp(DATA);fn(nd);nd.ts=Date.now();DATA=nd;qsave(nd);render();}
async function boot(){try{let d=await gasLoad();if(!d){d=mkData();try{await gasSave(d);}catch(_){}}else fix(d);DATA=d;LATEST=d;}catch(e){DATA=mkData();LATEST=DATA;showToast("서버 연결 실패");}render();POLL=setInterval(async()=>{try{const r=await gasLoad();if(r&&(r.ts||0)>(DATA.ts||0)){DATA=fix(r);LATEST=DATA;render();setPill("연동됨","#1D9E75");}}catch(_){}},6000);}
function render(){if(PAGE==="main")renderMain();else if(PAGE==="team")renderTeam();else if(PAGE==="add")renderAdd();}
function renderMain(){const order=DATA.order||[];const tots=order.map(id=>tSum(DATA,id));const gt=tots.reduce((a,b)=>a+b,0);const tod=order.reduce((s,id)=>{const t=DATA.teams[id];return s+(t&&t.days&&t.days[DK[0]]?t.days[DK[0]].c+t.days[DK[0]].e:0);},0);const mx=Math.max(...tots,1);let cards="";order.forEach((id,i)=>{const t=DATA.teams[id];if(!t)return;cards+=`<div class="team-card" onclick="openTeam('${id}')"><div class="team-icon" style="background:${t.f}">${ab(t.n)}</div><span class="team-name">${t.n}</span><span class="team-count">${tots[i].toLocaleString()}명</span><div class="team-bar-wrap"><div class="team-bar" style="width:${Math.round(tots[i]/mx*100)}%;background:${t.f}"></div></div></div>`;});document.getElementById("app").innerHTML=`<div class="hdr"><div><div class="hdr-sub">구내식당</div><div class="hdr-title">식수 관리</div></div>${pillHTML()}<span class="spacer"></span><button class="btn btn-teal" onclick="copyShare()">공유</button><button class="btn" onclick="goAdd()">＋</button></div><div class="summary"><div class="card-blue"><div class="card-lbl" style="color:#85B7EB">오늘 식수</div><div class="card-num" style="color:#fff">${tod}<span style="font-size:13px;font-weight:400;color:#85B7EB;margin-left:5px">명</span></div><div class="card-sub" style="color:#5B9DD6">${DATES[0].getMonth()+1}/${DATES[0].getDate()} (${WD[DATES[0].getDay()]})</div></div><div class="card-white"><div class="card-lbl" style="color:#bbb">2주 합계</div><div class="card-num">${gt.toLocaleString()}<span style="font-size:13px;font-weight:400;color:#ccc;margin-left:5px">명</span></div><div class="card-sub" style="color:#bbb">일 평균 ${Math.round(gt/DATES.length)}명</div></div></div><div class="all-btn" onclick="openTeam('all')"><span style="font-size:22px">📊</span><div style="flex:1"><div style="font-size:13px;font-weight:600;color:#fff">전체팀 집계 조회</div><div style="font-size:11px;color:#666;margin-top:1px">팀별 · 일자별 · 전체 합계</div></div><span style="font-size:18px;color:#444">›</span></div><div class="sec-lbl">팀 선택 — 인원 입력</div><div class="grid">${cards}</div>`;}
function openTeam(id){TID=id;PAGE="team";render();}
function renderTeam(){const isAll=TID==="all";const t=isAll?null:DATA.teams[TID];const order=DATA.order||[];const gt2=DK.reduce((s,k)=>s+dSum(DATA,k),0);const td2=dSum(DATA,DK[0]);let content="";if(isAll){const sc=[{l:"2주 전체",v:`${gt2.toLocaleString()}명`,bg:"#0C447C",lc:"#85B7EB",vc:"#fff"},{l:"오늘",v:`${td2}명`,bg:"#E1F5EE",lc:"#0F6E56",vc:"#085041"},{l:"일 평균",v:`${Math.round(gt2/DK.length)}명`,bg:"#FAEEDA",lc:"#854F0B",vc:"#633806"}];let sum=`<div class="sum3">`;sc.forEach(c=>{sum+=`<div class="sum-card" style="background:${c.bg}"><div style="font-size:10px;color:${c.lc};margin-bottom:2px">${c.l}</div><div style="font-size:18px;font-weight:700;color:${c.vc}">${c.v}</div></div>`;});sum+="</div>";let hdr=`<tr><th style="text-align:left;min-width:75px">팀</th><th style="text-align:left;min-width:44px">구분</th>`;DATES.forEach(d=>{hdr+=`<th>${(d.getMonth()+1)}/${d.getDate()}<br>(${WD[d.getDay()]})</th>`;});hdr+="<th>합계</th></tr>";let totRow=`<tr><td colspan="2" class="tt tl">전체 합계</td>`;DK.forEach(k=>{totRow+=`<td class="tt">${dSum(DATA,k)}</td>`;});totRow+=`<td class="tt-blue">${gt2}</td></tr>`;let tbody="";order.forEach(id=>{const t2=DATA.teams[id];if(!t2)return;let cs=0,es=0;let r1=`<tr><td class="tl" style="font-weight:600;color:#1a1a1a" rowspan="2"><span style="display:inline-flex;align-items:center;gap:5px"><span style="width:6px;height:6px;border-radius:50%;background:${t2.f};display:inline-block"></span>${t2.n}</span></td><td class="tl">기본</td>`;DK.forEach(k=>{const v=t2.days&&t2.days[k]?t2.days[k].c:t2.d;cs+=v;r1+=`<td>${v}</td>`;});r1+=`<td class="ts">${cs}</td></tr>`;let r2=`<tr><td class="tl" style="color:#0F6E56">외부</td>`;DK.forEach(k=>{const v=t2.days&&t2.days[k]?t2.days[k].e:0;es+=v;r2+=`<td style="color:#0F6E56">${v>0?"+"+v:v}</td>`;});r2+=`<td class="ts" style="color:#0F6E56">${es>0?"+"+es:es}</td></tr>`;tbody+=r1+r2;});content=`${sum}<div class="tbl-wrap"><table><thead>${hdr}${totRow}</thead><tbody>${tbody}</tbody></table></div>`;}else{let hdr=`<tr><th style="text-align:left;min-width:62px">구분</th>`;DATES.forEach(d=>{hdr+=`<th>${(d.getMonth()+1)}/${d.getDate()}<br>(${WD[d.getDay()]})</th>`;});hdr+="<th>합계</th></tr>";let cs=0,es=0;let r1=`<tr><td class="tl" style="color:#1a1a1a">기본 인원</td>`;let r2=`<tr><td class="tl" style="color:#0F6E56">외부 식수</td>`;let r3=`<tr><td class="tb">합계</td>`;DK.forEach(k=>{const cv=t.days&&t.days[k]?t.days[k].c:t.d;const ev=t.days&&t.days[k]?t.days[k].e:0;cs+=cv;es+=ev;r1+=`<td><input type="number" min="0" value="${cv}" oninput="cellChange('${k}','c',this.value)"></td>`;r2+=`<td><input type="number" min="0" class="ext" value="${ev}" oninput="cellChange('${k}','e',this.value)"></td>`;r3+=`<td id="tot_${k}">${cv+ev}</td>`;});r1+=`<td class="ts" id="csum">${cs}</td></tr>`;r2+=`<td class="ts" style="color:#0F6E56" id="esum">${es>0?"+"+es:es}</td></tr>`;r3+=`<td class="tb" id="tsum">${cs+es}</td></tr>`;content=`<div class="tbl-wrap"><table><thead>${hdr}</thead><tbody>${r1}${r2}${r3}</tbody></table></div>`;}const iconH=isAll?"":`<div class="team-icon-sm" style="background:${t.f}">${ab(t.n)}</div>`;const defH=isAll?"":`<div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#666">기본 인원:<input type="number" min="0" id="defInp" value="${t.d}" style="width:52px;padding:4px 6px;border:0.5px solid #ddd;border-radius:6px;font-size:13px;text-align:center;outline:none;color:#1a1a1a"><button class="btn btn-blue" onclick="applyDef()">전체 적용</button></div>`;document.getElementById("app").innerHTML=`<button class="back-btn" onclick="goMain()">← 메인</button><div class="page-hdr"><div style="display:flex;align-items:center;gap:10px">${iconH}<div><div style="font-size:16px;font-weight:700">${isAll?"전체팀 집계":t.n}</div><div style="font-size:11px;color:#aaa">${isAll?"조회 전용":`기본 ${t.d}명/일`}</div></div></div>${defH}</div>${pillHTML()}<div style="margin-top:10px">${content}`;}
function cellChange(k,f,raw){const v=Math.max(0,parseInt(raw)||0);if(!DATA.teams[TID].days[k])DATA.teams[TID].days[k]={c:DATA.teams[TID].d,e:0};DATA.teams[TID].days[k][f]=v;DATA.ts=Date.now();updateSums();qsave(DATA);}
function updateSums(){const t=DATA.teams[TID];if(!t)return;let cs=0,es=0;DK.forEach(k=>{const cv=t.days&&t.days[k]?t.days[k].c:t.d;const ev=t.days&&t.days[k]?t.days[k].e:0;cs+=cv;es+=ev;const el=document.getElementById("tot_"+k);if(el)el.textContent=cv+ev;});const c2=document.getElementById("csum");if(c2)c2.textContent=cs;const e2=document.getElementById("esum");if(e2)e2.textContent=es>0?"+"+es:es;const t2=document.getElementById("tsum");if(t2)t2.textContent=cs+es;}
function applyDef(){const v=parseInt(document.getElementById("defInp").value)||0;upd(d=>{d.teams[TID].d=v;DK.forEach(k=>{if(d.teams[TID].days[k])d.teams[TID].days[k].c=v;});});showToast(`기본 ${v}명 전체 적용`);}
function goAdd(){PAGE="add";renderAdd();}
function renderAdd(){const dots=PAL.map((p,i)=>`<div class="pal-dot${i===PALSEL?" sel":""}" style="background:${p.f}" onclick="selPal(${i})"></div>`).join("");document.getElementById("app").innerHTML=`<button class="back-btn" onclick="goMain()">← 메인</button><div style="font-size:14px;font-weight:600;margin-bottom:10px">새 팀 추가</div><div class="add-form"><div class="add-row"><div class="add-field"><span>팀명</span><input id="aN" style="width:110px" placeholder="팀명" oninput="updatePreview()"></div><div class="add-field"><span>기본 인원</span><input id="aD" type="number" min="0" style="width:72px;text-align:center" placeholder="0"></div><div class="add-field"><span>색상</span><div class="pal-row" id="palRow">${dots}</div></div></div><div id="preview" style="display:none" class="preview"><div id="prevIcon" style="width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff"></div><div><div id="prevName" style="font-size:13px;font-weight:600"></div><div id="prevDef" style="font-size:11px;color:#aaa"></div></div></div><button class="btn btn-green" style="width:100%;padding:12px 0;text-align:center;font-size:13px" onclick="addTeam()">+ 팀 추가</button></div>`;}
function selPal(i){PALSEL=i;document.querySelectorAll(".pal-dot").forEach((d,j)=>d.classList.toggle("sel",j===i));updatePreview();}
